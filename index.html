<title>Ngaji Qur’an – Belajar Membaca Al-Qur’an dari Nol</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F8F4;--card:#fff;--ink:#10261A;--mut:#47604F;--g:#0B5D3B;--on:#fff;--gold:#E3A800;--line:#C9DACE;--soft:#E3F0E7;--bad:#B3261E;--az:3.2rem;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1710;--card:#14241A;--ink:#EAF4ED;--mut:#A6BDAE;--g:#5CC891;--on:#06210F;--gold:#F0C23B;--line:#2A4132;--soft:#1B3025;--bad:#FF8A80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C1710;--card:#14241A;--ink:#EAF4ED;--mut:#A6BDAE;--g:#5CC891;--on:#06210F;--gold:#F0C23B;--line:#2A4132;--soft:#1B3025;--bad:#FF8A80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:1.1rem/1.6 "Atkinson Hyperlegible",system-ui,sans-serif}
#app{display:flex;min-height:100vh}
#nav{width:250px;padding:18px 12px;border-right:1px solid var(--line);background:var(--card);position:sticky;top:0;height:100vh;overflow:auto}
#nav .brand{display:flex;gap:10px;align-items:center;margin:0 6px 14px}
#nav .brand img{width:52px;height:52px}
#nav .brand b{line-height:1.2}
#nav a{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:700}
#nav a.on{background:var(--g);color:var(--on)}
#nav a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
main{flex:1;min-width:0;padding:22px;max-width:980px;margin:0 auto;width:100%}
.top{display:none}
h1{font-size:1.7rem;line-height:1.25;margin:.2em 0}h2{font-size:1.35rem;margin:1.2em 0 .5em}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:0 0 14px}
.c{text-align:center}.mut{color:var(--mut)}.sm{font-size:.95rem}
.ar{font-family:Amiri,"Scheherazade New","Noto Naskh Arabic",serif;direction:rtl;line-height:1.9}
.big{font-size:var(--az)}.huge{font-size:7rem;line-height:1.3}
.b,.b2{font:inherit;font-weight:700;border-radius:12px;padding:12px 18px;min-height:48px;cursor:pointer;margin:4px 4px 4px 0}
.b{background:var(--g);color:var(--on);border:0}.b2{background:transparent;color:var(--ink);border:2px solid var(--g)}
.b.xl{font-size:1.35rem;padding:16px 30px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.lt{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;cursor:pointer;color:var(--ink);font:inherit;min-height:96px}
.lt .ar{font-size:2.4rem;display:block;line-height:1.4}.lt.on{border-color:var(--gold);border-width:3px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hero{position:relative;overflow:hidden;background:var(--g);color:var(--on);border-radius:22px;padding:26px;display:flex;gap:22px;align-items:center;margin-bottom:16px}
.hero .wm{position:absolute;right:-10px;bottom:-40px;font-size:11rem;opacity:.1;pointer-events:none}
.hero .lg{flex:none;width:176px;height:176px;border-radius:50%;background:#fff;padding:4px;box-shadow:0 0 0 5px var(--gold)}
.hero .lg img{width:100%;height:100%;object-fit:contain}
.hero p{margin:.3em 0}.hero .b{background:var(--gold);color:#241a00}
.bar{display:grid;grid-template-columns:130px 1fr 52px;gap:10px;align-items:center;margin:9px 0}
.bar i{height:16px;border-radius:9px;background:var(--soft);position:relative;overflow:hidden}
.bar i:after{content:"";position:absolute;inset:0 auto 0 0;width:var(--w);background:var(--g)}
.opts{display:grid;gap:10px;margin-top:12px}.opt{text-align:center}
.opt.ok{background:#1E8A4F!important;color:#fff!important}.opt.no{background:var(--bad)!important;color:#fff!important}
.chip{padding:8px 14px;border-radius:99px;border:2px solid var(--g);background:none;color:var(--ink);font:inherit;font-weight:700;cursor:pointer}.chip.on{background:var(--g);color:var(--on)}
.lv{display:flex;gap:14px;align-items:center}.lv .n{flex:none;width:44px;height:44px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:700}
.lv.cur{border:3px solid var(--gold)}.lv.dn .n{background:var(--g);color:var(--on)}
.badge{opacity:.45;filter:grayscale(1)}.badge.on{opacity:1;filter:none;border-color:var(--gold)}
table{width:100%;border-collapse:collapse;font-size:.95rem}td,th{padding:6px;border-bottom:1px solid var(--line);text-align:left}
input,select,textarea{font:inherit;padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
td input{width:70px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;max-width:90vw;display:none;z-index:9}
.ok{color:#1E8A4F}.wr{color:#B26B00}
@media(max-width:820px){
#app{display:block}
#nav{position:fixed;top:auto;bottom:0;left:0;right:0;width:auto;height:auto;display:flex;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);border-right:0;z-index:5}
#nav .brand{display:none}
#nav a{flex-direction:column;gap:0;font-size:.78rem;white-space:nowrap;padding:6px 10px}
main{padding:14px 14px 100px}
.top{display:flex;gap:10px;align-items:center;margin-bottom:10px}.top img{width:40px;height:40px}
.hero{flex-direction:column;text-align:center;padding:22px 16px}.hero .wm{font-size:8rem}
.bar{grid-template-columns:96px 1fr 46px}.huge{font-size:5.5rem}
}
@media(prefers-reduced-motion:no-preference){.hero{animation:in .6s ease-out}@keyframes in{from{opacity:0;transform:translateY(8px)}}}
</style></head>

let S;try{S=Object.assign({},def,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){S={...def}}

const fmt=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const tod=()=>fmt(new Date());
function streak(){let n=0,d=new Date();if(!S.days.includes(fmt(d)))d=new Date(Date.now()-864e5);while(S.days.includes(fmt(d))){n++;d=new Date(d-864e5)}return n}
function act(){const d=tod();if(!S.days.includes(d)){S.days.push(d);save()}}
function addMin(n){if(S.tm.d!=tod())S.tm={d:tod(),m:0};S.tm.m+=n;save()}
const todayPct=()=>S.tm.d==tod()?Math.min(100,Math.round(S.tm.m*100/S.target)):0;
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",3800)}
function say(t,n=1){try{act();stopAll();const u=new SpeechSynthesisUtterance(t);u.lang="ar-SA";u.rate=S.rate;const v=speechSynthesis.getVoices().find(v=>v.lang.indexOf("ar")==0);if(v)u.voice=v;else if(!say.w){say.w=1;toast("Suara Arab belum terpasang di perangkat ini. Pasang suara Arab pada pengaturan teks-ke-suara.")}u.onend=()=>{if(n>1)say(t,n-1)};speechSynthesis.speak(u)}catch(e){toast("Audio belum didukung di perangkat ini.")}}

function tryPlay(urls,txt,my,msg){return new Promise(res=>{let i=0;const go=()=>{if(my!=tok)return res(0);if(i>=urls.length){if(!tryPlay.w){tryPlay.w=1;toast(msg||"Audio qari memerlukan koneksi internet. Sementara memakai suara perangkat.")}return ttsP(txt).then(res)}

<h2>Riwayat setoran</h2>${S.rec.length?S.rec.slice(-8).reverse().map(r=>`<div class="card sm">${r.t} · ${r.d}<br><span class="ok">Tersimpan dan siap diperiksa oleh guru.</span></div>`).join(""):`<p class="mut">Belum ada setoran. Pilih ayat, dengarkan contoh, lalu tekan “Saya Coba”.</p>`}<p class="sm mut">Catatan prototype: rekaman audio hanya disimpan di perangkat ini selama aplikasi terbuka; versi lengkap menyimpannya ke server agar guru dapat mendengarkan.</p>`};
const sS=v=>{ST.s=v;ST.a=0;render()},sA=v=>{ST.a=v;render()};
const aft=()=>{S.rec.push({t:SR[ST.s].n+" ayat "+(ST.a+1),d:tod()});if(S.rec.length>50)S.rec.shift();save()};
P.progress=()=>{const ks=Object.keys(CAT),v=ks.map(k=>S.sc[k]||0),avg=Math.round(v.reduce((a,b)=>a+b,0)/6),low=ks.slice().sort((a,b)=>(S.sc[a]||0)-(S.sc[b]||0)).slice(0,2).map(k=>CAT[k]);
return`<h1>📈 Progress Saya</h1><div class="card"><b>PROGRES MENGAJI SAYA</b>${ks.map(k=>`<div class="bar"><span>${CAT[k]}</span><i style="--w:${S.sc[k]||0}%"></i><b>${S.sc[k]||0}%</b></div>`).join("")}<p>Nilai rata-rata: <b>${avg}</b> · ${pr(avg)}</p></div><div class="card"><b>Rekomendasi</b><p>Fokus latihan Anda berikutnya adalah ${low.join(" dan ")}.</p></div><p class="sm mut">Skala: 0–59 Perlu bimbingan · 60–74 Mulai berkembang · 75–89 Baik · 90–100 Sangat baik.</p>`};
P.prestasi=()=>`<h1>🏆 Prestasi</h1><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(170px,1fr))">${BD.map(b=>`<div class="card c badge ${b[1]()?"on":""}"><div style="font-size:2.4rem">🏆</div><b>${b[0]}</b></div>`).join("")}</div>`;
P.guru=()=>`<h1>👨‍🏫 Guru / Murobbi</h1><div class="card"><div class="row"><input id="kn" placeholder="Nama kelas baru"><button class="b" onclick="gk()">Buat kelas</button></div></div>${S.cls.length?S.cls.map((c,ci)=>`<div class="card"><h2>${esc(c.n)}</h2><div style="overflow-x:auto"><table><tr><th>Nama siswa</th><th>Level</th><th>Kelancaran</th><th>Tajwid</th><th>Tahsin</th><th>Nilai</th><th>Progress</th></tr>${c.st.map((s,si)=>`<tr><td>${esc(s.n)}</td>${["l","k","t","h","v"].map(f=>`<td><input type="number" min="0" max="${f=="l"?10:100}" value="${s[f]||0}" onchange="gs(${ci},${si},'${f}',this.value)"></td>`).join("")}<td>${Math.round((s.l||0)*10)}%</td></tr><tr><td colspan="7"><input style="width:100%" placeholder="Catatan kesalahan bacaan" value="${esc(s.c||"")}" onchange="gs(${ci},${si},'c',this.value)"></td></tr>`).join("")}</table></div><div class="row"><input id="sn${ci}" placeholder="Nama siswa"><button class="b2" onclick="ga(${ci})">+ Tambah peserta</button></div><div class="row"><input id="tg${ci}" placeholder="Tugas atau materi"><button class="b2" onclick="gt(${ci})">+ Beri tugas</button></div>${(c.tg||[]).map(t=>`<p class="sm">📌 ${esc(t)}</p>`).join("")}</div>`).join(""):`<p class="mut">Belum ada kelas. Buat kelas untuk menambahkan peserta, memberi tugas, nilai, dan catatan.</p>`}<p class="sm mut">Prototype: data kelas tersimpan di perangkat ini. Versi lengkap memakai akun guru dan server.</p>`;
function gk(){const n=$("#kn").value.trim();if(n){S.cls.push({n,st:[],tg:[]});save();render()}}
function ga(c){const n=$("#sn"+c).value.trim();if(n){S.cls[c].st.push({n});save();render()}}
function gs(c,s,f,v){S.cls[c].st[s][f]=f=="c"?v:+v;save();render()}
function gt(c){const n=$("#tg"+c).value.trim();if(n){S.cls[c].tg.push(n);save();render()}}
P.pengaturan=()=>`<h1>⚙️ Pengaturan</h1><div class="card"><p><label>Nama panggilan<br><input value="${esc(S.name)}" onchange="S.name=this.value;save()"></label></p><p><label>Target harian<br><select onchange="S.target=+this.value;save()">${[5,10,15,30].map(m=>`<option ${S.target==m?"selected":""} value="${m}">${m} menit</option>`).join("")}</select></label></p><p><label>Ukuran tulisan Arab<br><input type="range" min="2.4" max="4.6" step=".2" value="${S.az}" onchange="S.az=+this.value;save();ap()"></label></p><p><label>Kecepatan audio<br><input type="range" min=".4" max="1.2" step=".1" value="${S.rate}" onchange="S.rate=+this.value;save()"></label></p><p><a href="#qari"><button class="b">🎧 Audio Qari per huruf</button></a></p><button class="b2" onclick="if(confirm('Hapus semua progress?')){localStorage.removeItem(KEY);S={...def,cls:[]};render()}">Hapus semua data</button></div>`;
let AK=new Set();
async function ak(){try{const d=await idb();AK=new Set(await new Promise(ok=>{const q=d.transaction("a").objectStore("a").getAllKeys();q.onsuccess=()=>ok(q.result);q.onerror=()=>ok([])}))}catch(e){AK=new Set()}}
P.qari=()=>{const n=AK.size;ak().then(()=>{if(AK.size!=n&&location.hash=="#qari")render()});
return`<h1>🎧 Audio Qari per Huruf</h1><div class="card"><p>Aplikasi ini belum membawa rekaman qari. Unggah rekaman bunyi tiap huruf yang Anda miliki atau berlisensi; setelah itu tombol “Dengarkan” memutar suara qari. Rekaman tersimpan di browser perangkat ini.</p><div class="row"><input id="qn" placeholder="Nama qari"><button class="b" onclick="qadd()">Tambah qari</button></div>${S.qaris.length?`<p>Qari aktif: <select aria-label="Qari aktif" onchange="qsel(+this.value)">${S.qaris.map((q,i)=>`<option value="${i}" ${q==S.qari?"selected":""}>${esc(q)}</option>`).join("")}</select></p><p><b>Unggah sekaligus</b><br><input type="file" multiple accept="audio/*" onchange="qbulk(this.files)"><br><span class="sm mut">Beri nama file sesuai urutan huruf (01.mp3 sampai 29.mp3) atau nama huruf (alif.mp3, ba.mp3, ta.mp3, dan seterusnya).</span></p>`:""}</div>${S.qari?`<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(140px,1fr))">${L.map((l,i)=>{const has=AK.has(S.qari+"|"+l[0]);return`<div class="card c"><div class="ar" style="font-size:2.4rem">${l[0]}</div><b>${l[1]}</b><p class="${has?"ok":"mut"}">${has?"✓ Ada":"Belum ada"}</p>${has?`<button class="b2" data-t="${l[0]}" onclick="play(this.dataset.t,this.dataset.t)">▶ Putar</button>`:""}<label class="b2" style="display:inline-block">Unggah<input type="file" accept="audio/*" hidden onchange="qone(${i},this.files[0])"></label></div>`}).join("")}</div>`:""}`};
function qadd(){const n=$("#qn").value.trim();if(!n)return;if(!S.qaris.includes(n))S.qaris.push(n);S.qari=n;save();render()}
function qsel(v){S.qari=S.qaris[v];save();render()}
async function qone(i,f){if(!f||!S.qari)return;await aset(L[i][0],f);await ak();render();toast("Rekaman "+L[i][1]+" tersimpan.")}
async function qbulk(fs){let n=0;for(const f of fs){const s=f.name.replace(/\.[^.]+$/,"").toLowerCase().replace(/[^a-z0-9]/g,"");let i=/^\d+$/.test(s)?+s-1:L.findIndex(l=>l[1].toLowerCase().replace(/[^a-z]/g,"")==s);if(i>=0&&i<L.length){await aset(L[i][0],f);n++}}await ak();render();toast(n+" rekaman tersimpan."+(n<fs.length?" Sebagian nama file tidak dikenali.":""))}
const ap=()=>document.documentElement.style.setProperty("--az",S.az+"rem");
const M=[["beranda","🏠","Beranda"],["belajar","📖","Belajar Mengaji"],["huruf","🔤","Huruf Hijaiyah"],["latihan","🔊","Latihan Bacaan"],["tajwid","📚","Tajwid"],["setoran","🎙️","Setoran Bacaan"],["progress","📈","Progress Saya"],["prestasi","🏆","Prestasi"],["guru","👨‍🏫","Guru/Murobbi"],["pengaturan","⚙️","Pengaturan"]];
const PAR={harakat:"belajar",sambung:"belajar",baca:"belajar",lancar:"belajar",makhraj:"belajar",tahsin:"belajar",mushaf:"belajar",tes:"belajar",qari:"pengaturan"};
function render(){let p=(location.hash||"#beranda").slice(1);if(!P[p])p="beranda";if(!S.lvl&&!S.seen&&p=="beranda"){S.seen=1;save();p="tes"}
const on=PAR[p]||p;$("#nav").innerHTML=`<div class="brand"><img src="${LOGO2}" alt="Logo Ngaji Qur’an"><b>Ngaji Qur’an<br><span class="sm mut">SMKN 2 Pinrang</span></b></div>`+M.map(m=>`<a href="#${m[0]}" class="${on==m[0]?"on":""}"><span>${m[1]}</span>${m[2]}</a>`).join("");
stopAll();$("#view").innerHTML=P[p]()}
window.addEventListener("hashchange",()=>{hk=null;render();scrollTo(0,0)});ap();act();render();
</script></body></html>
